    <section class="py-5 bg-light text-center">
        <div class="container">
            <h1 class="fw-bold">Travel Booking Form</h1>
            <p class="lead">Fill the form and submit your travel requests</p>
        </div>
    </section>

    <!-- Booking Form -->
     <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-8">
                    <div class="card shadow-lg p-4 rounded-8">
                        <h3 class="fw-bold mb-4 text-center">Book Your Trip</h3>
                        <form>
                            <div class="row">
                                <div class="col-12 col-md-6 mb-3">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" class="form-control" placeholder="Enter Full Name">
                                </div>
                                <div class="col-12 col-md-6 mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" placeholder="Enter your Email">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-12 col-md-6 mb-3">
                                    <label class="form-label">Select Destination</label>
                                    <select class="form-select">
                                        <option>Goa</option>
                                        <option>Manali</option>
                                        <option>Kerala</option>
                                        <option>Jaipur</option>
                                        <option>Agra</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-6 mb-3">
                                    <label class="form-label">Travel Date</label>
                                    <input type="data" class="form-control">
                                </div>

                            </div>
                            <div class="mb-3">
                                <label class="form-label">Number of People</label>
                                <input type="number" class="form-label" placeholder="Enter number of people">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Messege / Requirenment</label>
                                <textarea class="form-control" rows="4" placeholder="Enter any travel requirenment"></textarea>
                            </div>
                            <button type="submit" class="btn btn-success w-100">
                                Submit Booking Request
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
     </section>
